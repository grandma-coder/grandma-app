name: Translations

# Translates new or changed English text into the app's active languages and commits the
# result back to the pull request, so every PR reaches review already translated.
# Needs the ANTHROPIC_API_KEY repository secret; without it the job is skipped and the
# i18n coverage test in CI still fails on anything untranslated.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-sync-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: env.ANTHROPIC_API_KEY != ''
        run: npm ci

      - name: Translate new or changed text
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run i18n:sync

      - name: Commit translations
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          git config user.name grandma-coder
          git config user.email grandma-coder@users.noreply.github.com
          git add lib/i18n lib/pillarContent lib/pregnancyContent lib/birthGuideContent i18n-manifest.json
          if git diff --cached --quiet; then echo "Nothing to translate."; exit 0; fi
          git commit -m "chore(i18n): translate new and changed text"
          git push
