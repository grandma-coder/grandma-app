appId: co.sauceroom.grandma
---
# Scene 4: log today's mood from the cycle home: first Log-for-today chip (mood,
# no a11y label) → GREAT → SAVE MOOD; the chip turns into the logged mood.
# back to the top; start below the ring (a drag on the ring spins it to another day)
- swipe: { start: "50%,60%", end: "50%,95%", duration: 400 }
- runFlow: { file: _pause.yaml, env: { MS: 700 } }
- tapOn: { point: "49,798" }
- extendedWaitUntil:
    visible: "SAVE.*|SALVAR.*"
    timeout: 5000
- runFlow: { file: _pause.yaml, env: { MS: 700 } }
- tapOn: { point: "379,712" }
- runFlow: { file: _pause.yaml, env: { MS: 700 } }
- tapOn: "SAVE.*|SALVAR.*"
- runFlow: { file: _pause.yaml, env: { MS: 2200 } }
