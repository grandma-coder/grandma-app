appId: co.sauceroom.grandma
---
- runFlow:
    file: _open.yaml
    env:
      LINK: "grandma-app://onboarding/journey?addMode=true"
- waitForAnimationToEnd
# Card titles: "Pregnant" / "Grávida" (onboardingJourney_pregnant); old names kept as fallback.
- tapOn: "Pregnant|Grávida|Pregnancy|Gravidez"
- waitForAnimationToEnd
- swipe: { direction: UP, duration: 900 }
- waitForAnimationToEnd
