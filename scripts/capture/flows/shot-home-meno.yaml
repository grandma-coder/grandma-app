appId: co.sauceroom.grandma
---
- runFlow: mode-meno.yaml
- waitForAnimationToEnd
# Week strip is at the top of meno home; quick-log chips sit below (always visible,
# English-only labels in the app today: "Hot flashes", accessibilityLabel "Log Hot flashes").
- scrollUntilVisible:
    element: "Hot flash.*|Ondas? de calor|Onda de calor"
    direction: DOWN
    optional: true
- tapOn: "Hot flash.*|Ondas? de calor|Onda de calor"
- waitForAnimationToEnd
- swipe: { direction: DOWN, duration: 900 }
- waitForAnimationToEnd
